[package]
name = "tuios"
description = "TUI-OS: a 100% Rust operating system with a TUI desktop"
version = "0.1.0"
authors = ["Vincent Ollivier <v@vinc.cc>"]
edition = "2018"
license = "MIT"
readme = "README.md"
default-run = "tuios"

[features]
default = ["video"]
video = []
serial = []
userspace = []
limine = []
multiboot = []

[dependencies]
acpi = "5.0.0"
aml = "0.16.4"
bit_field = "0.10.3"
chumsky = { version = "0.13.0", default-features = false }
lazy_static = { version = "1.5.0", features = ["spin_no_std"] }
libm = "0.2.16"
linked_list_allocator = "0.10.6"
object = { version = "0.40.0", default-features = false, features = ["read"] }
pc-keyboard = "0.8.0"
rand = { version = "0.9.2", default-features = false }
rand_hc = "0.4.0"
ratatui = { version = "0.30.2", default-features = false, features = ["all-widgets"] }
raw-cpuid = "11.6.0"
sha2 = { version = "0.10.9", default-features = false, features = ["force-soft"] }
smoltcp = { version = "0.14.0", default-features = false, features = ["alloc", "medium-ethernet", "socket-tcp", "socket-udp", "socket-dhcpv4", "proto-ipv4", "proto-dhcpv4"] }
spin = "0.12.0"
time = { version = "0.2.27", default-features = false }
uart_16550 = "0.4.0"
vte = "0.13.1"
x86_64 = "0.15.2"

[target.'cfg(target_arch = "x86_64")'.dependencies]
bootloader = { version = "0.9.34", features = ["map_physical_memory", "sse"] }
limine = "0.6.3"

[target.'cfg(target_arch = "x86")'.dependencies]
multiboot2 = { version = "0.28.0", default-features = false }

[package.metadata.bootloader]
physical-memory-offset = "0xFFFF800000000000"
kernel-stack-address   = "0xFFFFFF8000000000"
boot-info-address      = "0xFFFFFFFF80000000"
kernel-stack-size = 64 # 64 * 4 KB

[package.metadata.bootimage]
test-success-exit-code = 33 # (0x10 << 1) | 1
